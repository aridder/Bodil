# fritaksmetoden (sktl. § 2-38). Den skal derfor stå i gevinst_ved_realisasjon_av_aksjer
# og ikke i andre_finansinntekter, der Wenche skattlegger den fullt. Skattepliktig inntekt
# blir −125 og skattekostnaden 0.
#
# KUN syntetiske data. Aldri ekte fødselsnummer her (fila versjoneres).

